<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainy — TODOs</title>
  <meta name="theme-color" content="#F7F3ED">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="mock-banner" hidden>Mock mode: fake demo TODOs, kept in memory only (no Supabase config on localhost).</div>

  <section id="auth-section" hidden>
    <h1>TODOs</h1>
    <p>Sign in to open your TODOs.</p>
    <button id="login-btn" type="button" class="primary">Sign in with Google</button>
  </section>

  <div id="app" hidden>
    <header id="top">
      <h1>TODOs</h1>
      <div id="filters">
        <select id="f-priority" aria-label="Priority filter">
          <option value="">All priorities</option>
          <option value="P0">P0</option>
          <option value="P1">P1</option>
          <option value="P2">P2</option>
          <option value="P3">P3</option>
        </select>
        <select id="f-category" aria-label="Category filter"><option value="">All categories</option></select>
        <input type="search" id="f-q" placeholder="Search name or summary…" autocomplete="off" aria-label="Search">
      </div>
      <div class="actions">
        <a id="archived-toggle" class="button-link" href="#archived=1">Archived</a>
        <button id="reload-btn" type="button" title="Reload from Brainy">⟳</button>
        <button id="logout-btn" type="button">Sign out</button>
      </div>
    </header>

    <main>
      <div id="limit-warning" hidden></div>
      <section id="due-strip" aria-label="Due soon"></section>
      <div id="board">
        <section class="column" data-status="inbox"><h2>Inbox <span class="count">0</span></h2><div class="cards"></div></section>
        <section class="column" data-status="active"><h2>Active <span class="count">0</span></h2><div class="cards"></div></section>
        <section class="column" data-status="later"><h2>Later <span class="count">0</span></h2><div class="cards"></div></section>
        <section class="column" data-status="scheduled"><h2>Scheduled <span class="count">0</span></h2><div class="cards"></div></section>
      </div>
      <section id="archive" hidden aria-label="Archived TODOs">
        <h2>Archived <span class="count">0</span></h2>
        <ul class="archive-list"></ul>
      </section>
      <p id="message" class="muted"></p>
    </main>
  </div>

  <div id="date-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="date-title">
    <form id="date-form">
      <h3 id="date-title">Schedule for</h3>
      <input type="date" id="date-input">
      <p id="date-error" class="error" hidden>Pick a date.</p>
      <div class="dialog-buttons">
        <button type="button" id="date-cancel">Cancel</button>
        <button type="button" id="date-ok" class="primary">Schedule</button>
      </div>
    </form>
  </div>
  <div id="detail-backdrop" hidden></div>
  <aside id="detail" hidden aria-labelledby="detail-title">
    <div class="detail-head">
      <h2 id="detail-title"></h2>
      <button id="detail-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="detail-body"></div>
  </aside>
  <div id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config.local.js"></script>
  <script src="../../config.js"></script>
  <script src="../../nav.js"></script>
  <script src="../../utils.js"></script>
  <script src="../../views/trip/mock-client.js"></script>
  <script src="core.js"></script>
  <script src="detail.js"></script>
  <script src="fixture.js"></script>
  <script src="app.js"></script>
</body>
</html>
